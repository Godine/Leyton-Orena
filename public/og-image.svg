<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leyton Arena — R&amp;D delivery, gamified">
  <title>Leyton Arena</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0F1845"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="rgba(247,92,3,0.30)"/>
      <stop offset="100%" stop-color="rgba(247,92,3,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,200,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,200,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Big minimal mark on the left, scaled 5× -->
  <g transform="translate(90 155) scale(5)">
    <rect width="64" height="64" rx="14" fill="#F75C03"/>
    <circle cx="32" cy="32" r="20" fill="none" stroke="#F5E6CA" stroke-width="8"/>
    <g fill="#F75C03">
      <rect x="-4" y="28" width="72" height="8" transform="rotate(45 32 32)"/>
      <rect x="-4" y="28" width="72" height="8" transform="rotate(-45 32 32)"/>
    </g>
  </g>

  <!-- Wordmark — the O of Leyton is the mark in miniature -->
  <g font-family="Nunito, system-ui, sans-serif" font-weight="900" font-size="124" fill="#f5f5fb">
    <text x="510" y="295">Leyt</text>
    <g transform="translate(696 200)">
      <circle cx="50" cy="65" r="42" fill="none" stroke="#F5E6CA" stroke-width="14"/>
      <g fill="#1a1a2e">
        <rect x="-14" y="58" width="128" height="14" transform="rotate(45 50 65)"/>
        <rect x="-14" y="58" width="128" height="14" transform="rotate(-45 50 65)"/>
      </g>
    </g>
    <text x="800" y="295">n</text>
  </g>
  <text x="510" y="425" font-family="Nunito, system-ui, sans-serif" font-weight="900" font-size="124"
        fill="#F75C03">Arena</text>

  <text x="512" y="485" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" font-size="32"
        fill="#a0a0c0">R&amp;D delivery, gamified.</text>

  <g transform="translate(510 525)" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="22">
    <g>
      <rect x="0" y="0" rx="14" ry="14" width="170" height="40" fill="rgba(247,92,3,0.15)" stroke="rgba(247,92,3,0.45)"/>
      <text x="20" y="27" fill="#F75C03">🔥 Daily fire</text>
    </g>
    <g transform="translate(190 0)">
      <rect x="0" y="0" rx="14" ry="14" width="170" height="40" fill="rgba(255,200,0,0.12)" stroke="rgba(255,200,0,0.4)"/>
      <text x="20" y="27" fill="#ffc800">🏆 Leaderboard</text>
    </g>
    <g transform="translate(380 0)">
      <rect x="0" y="0" rx="14" ry="14" width="160" height="40" fill="rgba(28,176,246,0.12)" stroke="rgba(28,176,246,0.4)"/>
      <text x="20" y="27" fill="#1cb0f6">⚔️ Duels</text>
    </g>
  </g>
</svg>
